[@Author::GETTY]
; Agent instructions are for the people and agents working in this repo,
; not for CPAN. Git::GatherDir runs with include_dotfiles, so without
; these two lines the whole .claude/ tree and CLAUDE.md end up in the
; tarball (karr #28). Same setting in Git::Libgit2.
gather_exclude_filename = CLAUDE.md
gather_exclude_match = ^\.claude/
