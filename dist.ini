name    = Git-Native
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year = 2026

[@Author::GETTY]
; The agent context ships once, as a snapshot: the bundle's
; [GatherAgentContext] copies CLAUDE.md and .claude/ from disk into
; misc/agent-context/ - in the tarball for build provenance, not
; installed. Git::GatherDir runs with include_dotfiles, so without these
; two lines the same files would ship a second time at their repository
; paths (karr #28). Same setting in Git::Libgit2.
gather_exclude_filename = CLAUDE.md
gather_exclude_match = ^\.claude/
